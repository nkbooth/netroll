[workspace]
resolver = "3"
members = [
    "crates/netroll-domain",
    "crates/netroll-adapters",
    "crates/netroll-app",
]

[workspace.dependencies]
axum = "0.8"
tokio = { version = "~1.47", features = ["full"] }
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "macros", "uuid", "chrono", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
uuid = { version = "1.18", features = ["v7", "serde"] }
sha2 = "0.10"
# Pure HMAC-SHA256 for the webhook signature; no I/O, so it is legal in the
# domain crate.
hmac = "0.12"
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Embedded IANA timezone database: the workspace `chrono` ships without tz data,
# and DST-correct local recurrence needs it. No I/O, so legal in the domain crate.
chrono-tz = "0.10"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder"] }
# `set-header` carries the app's own Content-Security-Policy onto its HTML
# responses.
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tower = "0.5"
axum-extra = { version = "0.12", features = ["cookie"] }
governor = "0.10"
tower_governor = "0.8"
rand = "0.9"
base64 = "0.22"
# CIDR membership and the stable IPv6 classification (ULA, link-local, …) that
# std keeps behind the unstable `#![feature(ip)]`, for the SSRF classifier. No
# I/O, so legal in the domain crate.
ip_network = "0.4"
# URL parser for the egress policy validator; reqwest re-exports this same crate.
url = "2"
# SSRF-safe outbound HTTP client (adapters only). rustls to match the lettre
# stack — no OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# AES-256-GCM for the envelope-encryption crypto adapter. RustCrypto, consistent
# with the sha2/hmac stack and the no-OpenSSL convention — not `ring`. The
# `zeroize` feature scrubs the internal GHASH key on drop; the default build
# leaves it un-scrubbed.
aes-gcm = { version = "0.10", features = ["zeroize"] }
# Not used directly. Present only for feature unification: enabling `zeroize`
# here makes the SAME resolved `aes` crate that `aes-gcm` uses internally scrub
# its round-key schedule on drop, which aes-gcm's own feature does not forward.
aes = { version = "0.8", default-features = false, features = ["zeroize"] }
# Tolerant XML event-reader for the QRZ callbook adapter. The QRZ spec mandates
# ignoring unknown, extra and namespaced nodes with no ordering assumptions, so
# the hand-matched event API is used, not serde-derive. 0.41 is the first line
# with RUSTSEC-2026-0194/0195 fixed.
quick-xml = "0.41"
# Memory-scrubbing for key material: the in-memory KEK and the plaintext QRZ
# credential bytes. No I/O, so legal in the domain crate.
zeroize = { version = "1", features = ["derive"] }
# Compile-time-checked templating for the transactional email HTML parts. Chosen
# over a runtime-parsed engine because the magic link is the sole authentication
# path: a derive macro turns an unknown variable or a syntax error into a build
# failure instead of a first-send failure in production. `default-features =
# false` drops the `config`/`urlencode` features these templates never use.
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }

# Declared once and inherited by every crate that opts in with `[lints]
# workspace = true`; a new crate without that line gets none of them. CI's
# `-D warnings` makes each an error.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
doc_markdown = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
