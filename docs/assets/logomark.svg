<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The NetRoll logomark, matching src/ui/components/Logomark.tsx: a concentric
    radio-signal arc set in a cyan rounded square. The dark theme's token
    values (accent #2BC8DE on bg #0D1117) are hardcoded because a favicon
    cannot read CSS custom properties and dark is the product default.

    Two constraints keep this file plain on purpose, both so the raster
    favicon.ico can be regenerated from it with ImageMagick's built-in SVG
    renderer (see README): comments carry no double hyphens, and the arc
    geometry is written in absolute 32-unit coordinates instead of a scaled
    group, because that renderer silently drops transformed groups and would
    emit a bare cyan square. Regenerate with:
      magick -background none -density 384 msvg:favicon.svg \
        -define icon:auto-resize=48,32,16 favicon.ico
  -->
  <rect width="32" height="32" rx="8.6" fill="#2BC8DE" />
  <path
    d="M10.4 16a5.6 5.6 0 0 1 11.2 0"
    fill="none"
    stroke="#0D1117"
    stroke-width="2"
    stroke-linecap="round"
  />
  <path
    d="M13.2 16a2.8 2.8 0 0 1 5.6 0"
    fill="none"
    stroke="#0D1117"
    stroke-width="2"
    stroke-linecap="round"
  />
  <circle cx="16" cy="16" r="1.2" fill="#0D1117" />
</svg>
